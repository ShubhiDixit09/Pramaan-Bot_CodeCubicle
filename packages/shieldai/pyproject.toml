[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldai-guardrails"
version = "0.1.0"
description = "Small, offline-first guardrails for high-stakes LLM applications"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shubhi Dixit" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["shieldai*"]


